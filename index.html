<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hvorfor er det ikke fredag?</title>
<meta name="description" content="Et vitenskapelig korrekt svar på spørsmålet. Nytt svar hver gang.">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:title" content="Hvorfor er det ikke fredag?">
<meta property="og:description" content="Et vitenskapelig korrekt svar på spørsmålet. Nytt svar hver gang.">
<!-- Bytt til full adresse når domenet er på plass, f.eks.
     https://brukernavn.github.io/hvorfor-er-det-ikke-fredag/og-bilde.png
     Facebook og Slack godtar ikke relative stier i delingsbilder. -->
<meta property="og:image" content="og-bilde.png">
<meta property="og:locale" content="nb_NO">
<meta name="twitter:card" content="summary_large_image">
<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    color: #fff;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: calc(var(--tekst) * 1.4);   /* luften følger skriften, ikke vinduet */
    padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem max(1.5rem, env(safe-area-inset-bottom));
    text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow: hidden;
  }

  /* Spørsmål og svar deler størrelse. Høydeleddet hindrer at lange svar
     sprenger skjermen i liggende modus, der bredden alene lyver om plassen. */
  :root {
    --tekst: clamp(1.5rem, min(5.5vw + 0.4rem, 8vh), 4rem);
  }

  .sporsmal,
  .svar {
    margin: 0;
    max-width: 24ch;
    font-size: var(--tekst);
  }

  /* Spørsmålet: tynt og dempet. Står stille, skal ikke ta oppmerksomheten. */
  .sporsmal {
    font-weight: 300;
    line-height: 1.2;
    letter-spacing: 0;
    color: #6e6e6e;
  }

  /* Svaret: halvfeit og hvitt. Det er dette man kommer for. */
  .svar {
    font-weight: 600;
    line-height: 1.15;
    letter-spacing: -0.02em;
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
    animation: tone-inn 250ms ease-out both;
  }

  /* Tall skal aldri brekke over to linjer. */
  .svar .tall { white-space: nowrap; }

  @keyframes tone-inn {
    from { opacity: 0; transform: translateY(0.35rem); }
    to   { opacity: 1; transform: none; }
  }

  .nytt {
    position: fixed;
    bottom: max(1.25rem, env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    appearance: none;
    background: none;
    border: 0;
    padding: 0.75rem 1rem;
    font: inherit;
    font-size: 0.875rem;
    color: #565656;
    cursor: pointer;
    transition: color 150ms ease;
  }
  .nytt:hover, .nytt:focus-visible { color: #a8a8a8; }
  .nytt:focus-visible { outline: 1px solid #565656; outline-offset: 2px; border-radius: 4px; }

  @media (prefers-reduced-motion: reduce) {
    .svar { animation: none; }
    .nytt { transition: none; }
  }

  /* Landskapsmodus på mobil: mindre luft, og knappen inn i flyten. */
  @media (max-height: 480px) {
    body { gap: calc(var(--tekst) * 0.8); }
    .nytt { position: static; transform: none; padding: 0.25rem; }
  }
</style>
</head>
<body>

  <h1 class="sporsmal">Hvorfor er det ikke fredag?</h1>

  <!-- Svaret uten JavaScript. Erstattes umiddelbart av et tilfeldig svar. -->
  <main class="svar" id="svar" aria-live="polite">Fordi ukedagene følger et fast system.</main>

  <button class="nytt" id="nytt" type="button">nytt svar</button>

<script src="astro.js"></script>
<script src="svar.js"></script>
<script>
(function () {
  var felt = document.getElementById('svar');
  var knapp = document.getElementById('nytt');

  // Pakker tall inn slik at de ikke brekkes over to linjer.
  function medTall(tekst) {
    var trygg = tekst.replace(/[&<>]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
    });
    return trygg.replace(/\d[\d  ,.]*\d|\d/g, function (m) {
      return '<span class="tall">' + m + '</span>';
    });
  }

  function nyttSvar() {
    var svar;
    try {
      svar = Svar.velg();
    } catch (e) {
      // Noe gikk galt i beregningene. Da står reservesvaret.
      return;
    }
    felt.innerHTML = medTall(svar.tekst);
    felt.setAttribute('data-svar', svar.id);
    felt.style.animation = 'none';
    void felt.offsetWidth;          // tvinger fram ny animasjon
    felt.style.animation = '';
  }

  knapp.addEventListener('click', nyttSvar);
  nyttSvar();
})();
</script>
</body>
</html>
